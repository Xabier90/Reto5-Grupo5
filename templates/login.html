<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../static/CSS-Pagina_Web/style.css">
</head>
<body>
    <header class="cabecera">
        <nav class="barra-navegacion">
            
            <div class="bloque-menu">
                <div class="menu-icono">
                    <img src="../static/Imagenes/tenedor_cuchara.avif" alt="Menú" class="img-icono">
                    <div class="menu-desplegable">
                        <a href="#">Quiénes Somos</a>
                        <a href="#">Red Social "La Comanda"</a>
                        <a href="#">Plan de Digitalización</a>
                        <a href="#">Plan de Sostenibilidad</a>
                    </div>
                </div>
            </div>
        
            <div class="bloque-logo">
                <img src="../static/Imagenes/Logo.png" alt="GastroLab" class="imagen-logo">
            </div>
        
            <div class="bloque-registro">
                <a href="{{ url_for('Pagina_principal') }}" class="boton-registro">Inicio</a>
            </div>
        
        </nav>
    </header>
    <main>
        <div class="formulario">
            <h1>Iniciar sesión</h1>
            <form action="" method="post">
                <div>
                    <!-- He fortalecido el requerimiento basico del input de email para garantizar que se
                    introduzca almenos 2 caracteres de dominio consultandolo a la IA debido al desconocimiento de como realizarlo -->
                    <label for="email_address">Correo electrónico</label><br>
                    <input type="email" name="email_address" required pattern="^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$">
                </div><br>
                <div>
                    <label for="password">Contraseña</label><br>
                    <input type="password" name="password" required>
                </div><br>
                <button type="submit">INICIAR SESIÓN</button>
                <br>
                <p style="color: #b16a29;"><b>{{ mensaje }}</b></p>
            </form>    
            
        </div>
    </main>
</body>
</html>
